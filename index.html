<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To-do List</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"/><script defer="defer" src="main.js"></script></head><body><div id="app-container"><header><button class="menu-btn btn"><i class="fa-solid fa-bars"></i></button><h1>To-Do List</h1></header><main><header class="main-header"><h2>Inbox</h2></header><ul class="task-list"></ul><button class="add-task-btn btn"><i class="fa-solid fa-plus"></i></button></main><div class="overlay"></div><nav class="navbar open"><button class="close-btn btn"><i class="fa-solid fa-angle-left"></i></button><h3>Mis Proyectos</h3><ul><li>Proyecto 1</li><li>Proyecto 2</li><li>Proyecto 3</li></ul><button class="btn add-project">(+) Nuevo Proyecto</button></nav></div><dialog class="task-dialog"><form method="dialog"><h3>Nueva Tarea</h3><div class="form-group"><input required placeholder="Nueva tarea..."></div><div class="form-group"><label for="task-date">Fecha Limite:</label> <input type="date" id="task-date" required></div><div class="dialog-buttons"><button class="cancel-btn" type="button" value="cancel">Cancelar</button> <button class="save-btn" type="submit" value="submit">Guardar</button></div></form></dialog></body></html>
